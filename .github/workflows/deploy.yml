name: Deploy Gilllda theme

on:
  push:
    branches: [main]
    paths:
      - 'themes/Gilllda/**'
      - 'plugins/gilllda-ai/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # "Run workflow" button in the Actions tab

# Never run two deploys at the same time; a newer push waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  THEME_DIR: themes/Gilllda
  SITE_URL: https://gilllda.ir

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: themes/Gilllda/package-lock.json

      - name: Install & build (Tailwind + esbuild)
        working-directory: ${{ env.THEME_DIR }}
        run: |
          npm ci --no-audit --no-fund
          npm run production

      - name: PHP syntax check
        run: |
          php -v | head -1
          find "$THEME_DIR/theme" plugins/gilllda-ai -name '*.php' -print0 2>/dev/null | xargs -0 -n1 -P4 php -l -d display_errors=1 > /tmp/lint.txt 2>&1 || {
            grep -v '^No syntax errors' /tmp/lint.txt; exit 1; }
          echo "All PHP files OK"

      - name: Upload built theme
        uses: actions/upload-artifact@v4
        with:
          name: theme
          path: ${{ env.THEME_DIR }}/theme/
          retention-days: 14

      - name: Upload plugin
        if: hashFiles('plugins/gilllda-ai/gilllda-ai.php') != ''
        uses: actions/upload-artifact@v4
        with:
          name: plugin-gilllda-ai
          path: plugins/gilllda-ai/
          retention-days: 14

  deploy:
    name: Deploy to gilllda.ir
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://gilllda.ir
    steps:
      - name: Check secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            [ -n "${!v}" ] || { echo "::error::Secret $v is not set"; exit 1; }
          done
          # The active theme lives in wp-content/themes/Gilllda/theme/ on the server.
          case "$FTP_SERVER_DIR" in
            */themes/Gilllda/theme/) echo "Server dir OK" ;;
            *) echo "::error::FTP_SERVER_DIR must end with /themes/Gilllda/theme/"; exit 1 ;;
          esac

      - name: Download built theme
        uses: actions/download-artifact@v4
        with:
          name: theme
          path: theme

      - name: Upload changed files via FTP(S)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./theme/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.DS_Store
            **/*.map

      - name: Download plugin
        id: plugin
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: plugin-gilllda-ai
          path: plugin

      - name: Plugin server path
        id: ppath
        if: steps.plugin.outcome == 'success'
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: echo "dir=${FTP_SERVER_DIR%themes/Gilllda/theme/}plugins/gilllda-ai/" >> "$GITHUB_OUTPUT"

      - name: Upload plugin via FTP(S)
        if: steps.plugin.outcome == 'success'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./plugin/
          server-dir: ${{ steps.ppath.outputs.dir }}
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.DS_Store

      - name: Smoke test the live site
        run: |
          set -e
          for path in "/" "/shop/" "/login/"; do
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /tmp/page.html -w '%{http_code}' -A 'Mozilla/5.0 (deploy-check)' "$SITE_URL$path?nocache=$GITHUB_RUN_ID") || code=000
              [ "$code" = "200" ] && break
              sleep 5
            done
            echo "$path -> HTTP $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
            if grep -qiE 'Fatal error|Parse error|critical error on this website|خطای مهلکی' /tmp/page.html; then
              echo "::error::PHP fatal error on $path"; grep -iE -m3 'Fatal error|Parse error' /tmp/page.html || true; exit 1
            fi
          done
          echo "Site is healthy ✅"
